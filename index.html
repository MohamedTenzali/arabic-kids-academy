<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arabic Kids Academy</title>
    <meta
      name="description"
      content="Arabic Kids Academy helpt kinderen stap voor stap Arabisch leren."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Nunito:wght@400;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/main.css">
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <header class="site-header home-header">
      <a class="brand" href="index.html" aria-label="Arabic Kids Academy home">
        <span class="brand-mark" aria-hidden="true">ا</span>
        <span>
          <span class="brand-name">Arabic Kids Academy</span>
          <span class="brand-subtitle">Arabisch leren voor kinderen</span>
        </span>
      </a>
    </header>

    <main class="home-main">
      <section class="hero hero-home" aria-labelledby="hero-title">
        <div class="letter-arc" lang="ar" dir="rtl" aria-hidden="true">
          <span style="--left: 18%; --top: 76%; --rotate: -48deg; --delay: 900ms; --z: 1; --card-color: #ffb703;">ز</span>
          <span style="--left: 23%; --top: 59%; --rotate: -42deg; --delay: 810ms; --z: 2; --card-color: #fb8500;">ر</span>
          <span style="--left: 29%; --top: 43%; --rotate: -34deg; --delay: 720ms; --z: 3; --card-color: #8ecae6;">ذ</span>
          <span style="--left: 36%; --top: 29%; --rotate: -24deg; --delay: 630ms; --z: 4; --card-color: #90be6d;">د</span>
          <span style="--left: 44%; --top: 19%; --rotate: -13deg; --delay: 540ms; --z: 5; --card-color: #f28482;">خ</span>
          <span style="--left: 52%; --top: 15%; --rotate: 0deg; --delay: 450ms; --z: 6; --card-color: #7bdff2;">ح</span>
          <span style="--left: 60%; --top: 19%; --rotate: 13deg; --delay: 360ms; --z: 5; --card-color: #b2f7ef;">ج</span>
          <span style="--left: 68%; --top: 29%; --rotate: 24deg; --delay: 270ms; --z: 4; --card-color: #f7aef8;">ث</span>
          <span style="--left: 75%; --top: 43%; --rotate: 34deg; --delay: 180ms; --z: 3; --card-color: #ffd166;">ت</span>
          <span style="--left: 81%; --top: 59%; --rotate: 42deg; --delay: 90ms; --z: 2; --card-color: #06d6a0;">ب</span>
          <span style="--left: 86%; --top: 76%; --rotate: 48deg; --delay: 0ms; --z: 1; --card-color: #ef476f;">ا</span>
        </div>

        <div class="hero-content">
          <p class="eyebrow">Welkom bij Arabic Kids Academy</p>
          <h1 id="hero-title">Leer Arabisch stap voor stap</h1>
          <p class="hero-text">
            Kies je niveau en begin met letters, klanken en oefenen.
          </p>
          <p class="arabic-example" lang="ar" dir="rtl">مرحبا بكم</p>
        </div>

        <section class="level-section home-levels" aria-labelledby="level-title">
          <div class="section-heading">
            <h2 id="level-title">Kies je niveau</h2>
            <p id="selected-level">Nog geen niveau gekozen.</p>
          </div>

          <div class="level-grid">
            <button class="level-card" type="button" data-level="Beginner" aria-pressed="false">
              <span class="level-name">Beginner</span>
              <span class="level-copy">Ik begin net met Arabisch.</span>
            </button>

            <button class="level-card" type="button" data-level="Gevorderd" aria-pressed="false">
              <span class="level-name">Gevorderd</span>
              <span class="level-copy">Ik ken al een paar letters.</span>
            </button>

            <button class="level-card" type="button" data-level="Expert" aria-pressed="false">
              <span class="level-name">Expert</span>
              <span class="level-copy">Ik wil extra uitdaging.</span>
            </button>
          </div>

          <a class="start-link is-disabled" href="pages/roadmap.html" aria-disabled="true">
            Start leerroute
          </a>
        </section>
      </section>
    </main>
  </body>
</html>
